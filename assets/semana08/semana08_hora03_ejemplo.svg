      <line x1="210" y1="24" x2="210" y2="320" stroke="#334155" stroke-width="1"/>
      <line x1="290" y1="24" x2="290" y2="320" stroke="#334155" stroke-width="1"/>
      <line x1="410" y1="24" x2="410" y2="320" stroke="#334155" stroke-width="1"/>

