      <text x="16" y="25" fill="#facc15" font-size="12" font-weight="800">🧮 Fórmulas exactas escritas por el alumno:</text>
      
      <rect x="14" y="36" width="501" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
