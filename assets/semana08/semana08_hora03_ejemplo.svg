      <text x="24" y="56" fill="#cbd5e1" font-size="11">En Celda <tspan fill="#38bdf8" font-weight="700">D2:</tspan> <tspan fill="#ffffff" font-weight="800">=B2-C2</tspan> (resta costo menos ahorro, arrastrar a D6)</text>

