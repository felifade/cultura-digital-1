<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 495" width="100%" height="100%" style="background:#ffffff; font-family:'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <!-- Sombra exterior sutil y ventana estilo Google Sheets -->
  <defs>
    <filter id="softShadowVesp" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Marco de la Ventana -->
  <rect x="5" y="5" width="840" height="485" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="url(#softShadowVesp)"/>

  <!-- BARRA DE TÍTULO GOOGLE SHEETS -->
  <rect x="5" y="5" width="840" height="60" rx="8" fill="#ffffff"/>
  
  <!-- Ícono oficial de Hojas de cálculo de Google (Verde con cuadrícula blanca) -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="26" height="34" rx="3" fill="#0f9d58"/>
    <path d="M18,0 L26,8 L18,8 Z" fill="#0b8043"/>
    <rect x="5" y="13" width="16" height="3" fill="#ffffff" rx="1"/>
    <rect x="5" y="19" width="16" height="3" fill="#ffffff" rx="1"/>
    <rect x="5" y="25" width="16" height="3" fill="#ffffff" rx="1"/>
  </g>

  <!-- Título del documento y menús -->
  <text x="58" y="30" fill="#202124" font-size="14" font-weight="600">Cotizacion_Altar_[Nombre]</text>
  <rect x="235" y="19" width="55" height="18" rx="4" fill="#e8f0fe"/>
  <text x="262" y="32" fill="#1967d2" font-size="10" font-weight="600" text-anchor="middle">En Drive</text>

  <!-- Menú superior estilo Google -->
  <text x="58" y="50" fill="#444746" font-size="12">Archivo    Editar    Ver    Insertar    Formato    Datos    Herramientas    Extensiones    Ayuda</text>

  <!-- Botón Compartir (Azul Google) -->
  <rect x="715" y="16" width="115" height="34" rx="17" fill="#c2e7ff"/>
  <circle cx="733" cy="33" r="6" fill="#001d35"/>
  <text x="775" y="38" fill="#001d35" font-size="12" font-weight="600" text-anchor="middle">Compartir</text>

  <!-- BARRA DE HERRAMIENTAS REALISTA -->
  <rect x="5" y="65" width="840" height="34" fill="#edf2fa" stroke="#dadce0" stroke-width="1"/>
  <g transform="translate(20, 73)" fill="#444746" font-size="12">
    <text x="0" y="14" font-size="13">↶</text>
    <text x="22" y="14" font-size="13">↷</text>
    <text x="44" y="14" font-size="13">🖨</text>
    <line x1="68" y1="2" x2="68" y2="18" stroke="#dadce0"/>
    <text x="80" y="14" font-size="11">100%</text>
    <line x1="120" y1="2" x2="120" y2="18" stroke="#dadce0"/>
    <rect x="128" y="-1" width="22" height="20" rx="3" fill="#d3e3fd"/>
    <text x="134" y="14" font-weight="800" fill="#041e49">$</text>
    <text x="158" y="14" font-weight="700">%</text>
    <text x="178" y="14" font-size="10">.0</text>
    <text x="195" y="14" font-size="10">.00</text>
    <line x1="225" y1="2" x2="225" y2="18" stroke="#dadce0"/>
    <text x="238" y="14" font-size="11">Arial</text>
    <text x="290" y="14" font-size="11">10</text>
    <line x1="315" y1="2" x2="315" y2="18" stroke="#dadce0"/>
    <text x="328" y="14" font-weight="800">B</text>
    <text x="346" y="14" font-style="italic">I</text>
    <text x="365" y="14">🎨</text>
    <text x="388" y="14">⊞</text>
    <text x="412" y="14">≡</text>
    <text x="436" y="14">∑ (Funciones)</text>
  </g>

  <!-- BARRA DE FÓRMULAS GOOGLE SHEETS -->
  <rect x="5" y="99" width="840" height="28" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <!-- Cuadro de Nombres (Celda activa) -->
  <rect x="18" y="103" width="50" height="20" rx="2" fill="#ffffff" stroke="#c7c7c7"/>
  <text x="43" y="117" fill="#1f1f1f" font-size="11" font-weight="600" text-anchor="middle">D2</text>
  
  <!-- Ícono fx -->
  <text x="82" y="118" fill="#5f6368" font-size="13" font-style="italic" font-weight="700">fx</text>
  <line x1="102" y1="103" x2="102" y2="123" stroke="#dadce0"/>
  
  <!-- Contenido real de la barra de fórmulas -->
  <text x="115" y="118" fill="#1a73e8" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700">=B2*C2</text>

  <!-- CUADRÍCULA DE CELDAS -->
  <g transform="translate(5, 127)">
    <!-- Encabezado de Columnas (Gris Google #f8f9fa) -->
    <rect x="0" y="0" width="840" height="24" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <rect x="0" y="0" width="40" height="24" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    
    <text x="160" y="16" fill="#444746" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <text x="345" y="16" fill="#444746" font-size="11" font-weight="700" text-anchor="middle">B</text>
    <text x="475" y="16" fill="#444746" font-size="11" font-weight="700" text-anchor="middle">C</text>
    <text x="605" y="16" fill="#444746" font-size="11" font-weight="700" text-anchor="middle">D</text>
    <text x="735" y="16" fill="#444746" font-size="11" font-weight="700" text-anchor="middle">E</text>

    <!-- Líneas divisoras verticales de columnas -->
    <line x1="40" y1="0" x2="40" y2="330" stroke="#dadce0" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="330" stroke="#dadce0" stroke-width="1"/>
    <line x1="410" y1="0" x2="410" y2="330" stroke="#dadce0" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="330" stroke="#dadce0" stroke-width="1"/>
    <line x1="670" y1="0" x2="670" y2="330" stroke="#dadce0" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="330" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 1: Encabezados Reales del Proyecto (Verde pastel suave) -->
    <rect x="40" y="24" width="630" height="28" fill="#e6f4ea"/>
    <!-- Número de fila 1 -->
    <rect x="0" y="24" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="42" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">1</text>
    <!-- Textos encabezados -->
    <text x="160" y="42" fill="#137333" font-size="11" font-weight="700" text-anchor="middle">Elemento Tradicional</text>
    <text x="345" y="42" fill="#137333" font-size="11" font-weight="700" text-anchor="middle">Cantidad</text>
    <text x="475" y="42" fill="#137333" font-size="11" font-weight="700" text-anchor="middle">Precio Unitario ($)</text>
    <text x="605" y="42" fill="#137333" font-size="11" font-weight="700" text-anchor="middle">Costo Total ($)</text>
    <line x1="0" y1="52" x2="840" y2="52" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 2: Cempasúchil -->
    <rect x="0" y="52" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="70" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">2</text>
    <text x="50" y="70" fill="#202124" font-size="11">Flor de Cempasúchil (ramo)</text>
    <text x="345" y="70" fill="#202124" font-size="11" text-anchor="middle">3</text>
    <text x="528" y="70" fill="#202124" font-size="11" text-anchor="end">$ 35.00</text>
    <text x="658" y="70" fill="#202124" font-size="11" font-weight="700" text-anchor="end">$ 105.00</text>
    <line x1="0" y1="80" x2="840" y2="80" stroke="#dadce0" stroke-width="1"/>

    <!-- CELDA SELECCIONADA EN D2 (Azul Google con puntito de autocompletar) -->
    <rect x="540" y="52" width="130" height="28" fill="none" stroke="#1a73e8" stroke-width="2"/>
    <rect x="667" y="77" width="5" height="5" fill="#1a73e8"/>

    <!-- FILA 3: Veladoras -->
    <rect x="0" y="80" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="98" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">3</text>
    <text x="50" y="98" fill="#202124" font-size="11">Veladoras de vaso grandes</text>
    <text x="345" y="98" fill="#202124" font-size="11" text-anchor="middle">6</text>
    <text x="528" y="98" fill="#202124" font-size="11" text-anchor="end">$ 18.50</text>
    <text x="658" y="98" fill="#202124" font-size="11" text-anchor="end">$ 111.00</text>
    <line x1="0" y1="108" x2="840" y2="108" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 4: Papel picado -->
    <rect x="0" y="108" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="126" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">4</text>
    <text x="50" y="126" fill="#202124" font-size="11">Papel picado tradicional</text>
    <text x="345" y="126" fill="#202124" font-size="11" text-anchor="middle">10</text>
    <text x="528" y="126" fill="#202124" font-size="11" text-anchor="end">$ 4.00</text>
    <text x="658" y="126" fill="#202124" font-size="11" text-anchor="end">$ 40.00</text>
    <line x1="0" y1="136" x2="840" y2="136" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 5: Copal e incienso -->
    <rect x="0" y="136" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="154" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">5</text>
    <text x="50" y="154" fill="#202124" font-size="11">Copal e incienso (bolsa)</text>
    <text x="345" y="154" fill="#202124" font-size="11" text-anchor="middle">2</text>
    <text x="528" y="154" fill="#202124" font-size="11" text-anchor="end">$ 25.00</text>
    <text x="658" y="154" fill="#202124" font-size="11" text-anchor="end">$ 50.00</text>
    <line x1="0" y1="164" x2="840" y2="164" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 6: Pan de muerto -->
    <rect x="0" y="164" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="182" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">6</text>
    <text x="50" y="182" fill="#202124" font-size="11">Pan de muerto tradicional</text>
    <text x="345" y="182" fill="#202124" font-size="11" text-anchor="middle">5</text>
    <text x="528" y="182" fill="#202124" font-size="11" text-anchor="end">$ 15.00</text>
    <text x="658" y="182" fill="#202124" font-size="11" text-anchor="end">$ 75.00</text>
    <line x1="0" y1="192" x2="840" y2="192" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 7: COSTO TOTAL DEL ALTAR -->
    <rect x="40" y="192" width="630" height="28" fill="#f1f3f4"/>
    <rect x="0" y="192" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="210" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">7</text>
    <text x="530" y="210" fill="#202124" font-size="11" font-weight="700" text-anchor="end">COSTO TOTAL DEL ALTAR:</text>
    <text x="658" y="210" fill="#137333" font-size="11" font-weight="800" text-anchor="end">$ 381.00</text>
    <line x1="0" y1="220" x2="840" y2="220" stroke="#dadce0" stroke-width="1"/>

    <!-- FILA 8: COOPERACIÓN POR ALUMNO (5) -->
    <rect x="40" y="220" width="630" height="28" fill="#e8f0fe"/>
    <rect x="0" y="220" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="238" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">8</text>
    <text x="530" y="238" fill="#1967d2" font-size="11" font-weight="700" text-anchor="end">COOPERACIÓN POR ALUMNO (5):</text>
    <text x="658" y="238" fill="#1967d2" font-size="11" font-weight="800" text-anchor="end">$ 76.20</text>
    <line x1="0" y1="248" x2="840" y2="248" stroke="#dadce0" stroke-width="1.5"/>

    <!-- FILA 9: Fila en blanco para realismo -->
    <rect x="0" y="248" width="40" height="28" fill="#f8f9fa" stroke="#dadce0" stroke-width="0.5"/>
    <text x="20" y="266" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">9</text>
    <line x1="0" y1="276" x2="840" y2="276" stroke="#dadce0" stroke-width="1"/>
  </g>

  <!-- PESTAÑA INFERIOR HOJA 1 -->
  <rect x="5" y="460" width="840" height="30" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <rect x="60" y="461" width="85" height="28" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <line x1="60" y1="488" x2="145" y2="488" stroke="#0f9d58" stroke-width="3"/>
  <text x="102" y="479" fill="#202124" font-size="11" font-weight="600" text-anchor="middle">Hoja 1</text>
  <text x="25" y="480" fill="#444746" font-size="16" font-weight="600">+</text>
</svg>
