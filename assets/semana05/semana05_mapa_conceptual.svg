<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#003366" flood-opacity="0.25"/>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="sem1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="sem2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="sem3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="sem4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Fondo sutil de cuadrícula punteada -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#e2e8f0"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Líneas Conectoras (Curvas Bezier) -->
  <path d="M 700 450 C 450 450, 350 250, 310 240" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 700 450 C 950 450, 1050 250, 1090 240" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 700 450 C 450 450, 350 650, 310 660" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 700 450 C 950 450, 1050 650, 1090 660" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- ==================== NODO CENTRAL ==================== -->
  <g filter="url(#centerShadow)">
    <circle cx="700" cy="450" r="140" fill="url(#centerGrad)" stroke="#ffffff" stroke-width="6"/>
    <circle cx="700" cy="450" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
    
    <text x="700" y="405" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800" letter-spacing="3">CEB 5/4 • 2026-2027</text>
    <text x="700" y="440" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">CULTURA</text>
    <text x="700" y="470" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">DIGITAL I</text>
    <rect x="630" y="485" width="140" height="26" rx="13" fill="#e0f2fe"/>
    <text x="700" y="503" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="800">PRIMER PARCIAL</text>
  </g>

  <!-- ==================== SEMANA 01 (SUPERIOR IZQUIERDA) ==================== -->
  <g filter="url(#shadow)" transform="translate(60, 60)">
    <rect width="500" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="500" height="60" rx="16" fill="url(#sem1Grad)"/>
    <rect y="45" width="500" height="15" fill="url(#sem1Grad)"/>
    <text x="25" y="38" fill="#ffffff" font-size="20" font-weight="800">📓 SEMANA 01: Encuadre y Libreta</text>

    <!-- Puntos Clave -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="12" r="10" fill="#f3e8ff"/>
      <text x="12" y="16" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">1</text>
      <text x="35" y="17" fill="#1e293b" font-size="15" font-weight="700">Libreta Física Profesional:</text>
      <text x="35" y="38" fill="#64748b" font-size="14">Forrada de morado (general) y azul (G110).</text>

      <circle cx="12" cy="72" r="10" fill="#f3e8ff"/>
      <text x="12" y="76" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">2</text>
      <text x="35" y="77" fill="#1e293b" font-size="15" font-weight="700">Boceto de Portada con Identidad:</text>
      <text x="35" y="98" fill="#64748b" font-size="14">Datos CEB 5/4, tema digital y 3 metas/gustos.</text>

      <circle cx="12" cy="132" r="10" fill="#f3e8ff"/>
      <text x="12" y="136" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">3</text>
      <text x="35" y="137" fill="#1e293b" font-size="15" font-weight="700">Tabla de 10 Acuerdos de Convivencia:</text>
      <text x="35" y="158" fill="#64748b" font-size="14">No., Acuerdo y Justificación (evitar burlas).</text>

      <circle cx="12" cy="192" r="10" fill="#f3e8ff"/>
      <text x="12" y="196" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">4</text>
      <text x="35" y="197" fill="#1e293b" font-size="15" font-weight="700">Pacto Ético de Cierre:</text>
      <text x="35" y="218" fill="#64748b" font-size="14">Compromiso personal firmado: "Leído y enterado".</text>
    </g>
  </g>

  <!-- ==================== SEMANA 02 (SUPERIOR DERECHA) ==================== -->
  <g filter="url(#shadow)" transform="translate(840, 60)">
    <rect width="500" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="500" height="60" rx="16" fill="url(#sem2Grad)"/>
    <rect y="45" width="500" height="15" fill="url(#sem2Grad)"/>
    <text x="25" y="38" fill="#ffffff" font-size="20" font-weight="800">🚀 SEMANA 02: Cuenta, Docs y Teclado</text>

    <!-- Puntos Clave -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="12" r="10" fill="#e0f2fe"/>
      <text x="12" y="16" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">1</text>
      <text x="35" y="17" fill="#1e293b" font-size="15" font-weight="700">Cuenta Institucional Personal:</text>
      <text x="35" y="38" fill="#64748b" font-size="14">Clave secreta segura y correo de respaldo.</text>

      <circle cx="12" cy="72" r="10" fill="#e0f2fe"/>
      <text x="12" y="76" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">2</text>
      <text x="35" y="77" fill="#1e293b" font-size="15" font-weight="700">Regla de Oro: Modo Incógnito:</text>
      <text x="35" y="98" fill="#64748b" font-size="14">Ctrl + Shift + N en PCs compartidas del lab.</text>

      <circle cx="12" cy="132" r="10" fill="#e0f2fe"/>
      <text x="12" y="136" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">3</text>
      <text x="35" y="137" fill="#1e293b" font-size="15" font-weight="700">Cuaderno Digital en Google Docs:</text>
      <text x="35" y="158" fill="#64748b" font-size="14">Organizado por Pestañas (Semana 01 y 02).</text>

      <circle cx="12" cy="192" r="10" fill="#e0f2fe"/>
      <text x="12" y="196" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">4</text>
      <text x="35" y="197" fill="#1e293b" font-size="15" font-weight="700">Teclado de Precisión y Arroba (@):</text>
      <text x="35" y="218" fill="#64748b" font-size="14">Obtener @ con Alt Gr + Q o Alt Gr + 2.</text>
    </g>
  </g>

  <!-- ==================== SEMANA 03 (INFERIOR IZQUIERDA) ==================== -->
  <g filter="url(#shadow)" transform="translate(60, 500)">
    <rect width="500" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="500" height="60" rx="16" fill="url(#sem3Grad)"/>
    <rect y="45" width="500" height="15" fill="url(#sem3Grad)"/>
    <text x="25" y="38" fill="#ffffff" font-size="20" font-weight="800">📱 SEMANA 03: Formato e Identidad</text>

    <!-- Puntos Clave -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="12" r="10" fill="#d1fae5"/>
      <text x="12" y="16" text-anchor="middle" fill="#059669" font-size="12" font-weight="bold">1</text>
      <text x="35" y="17" fill="#1e293b" font-size="15" font-weight="700">Formato Estricto en Google Docs:</text>
      <text x="35" y="38" fill="#64748b" font-size="14">Títulos T20 Negrita Centrado | Texto T14 Justificado.</text>

      <circle cx="12" cy="72" r="10" fill="#d1fae5"/>
      <text x="12" y="76" text-anchor="middle" fill="#059669" font-size="12" font-weight="bold">2</text>
      <text x="35" y="77" fill="#1e293b" font-size="15" font-weight="700">Palabras Clave Mnemotécnicas:</text>
      <text x="35" y="98" fill="#64748b" font-size="14">Color llamativo + un emoji relevante alusivo.</text>

      <circle cx="12" cy="132" r="10" fill="#d1fae5"/>
      <text x="12" y="136" text-anchor="middle" fill="#059669" font-size="12" font-weight="bold">3</text>
      <text x="35" y="137" fill="#1e293b" font-size="15" font-weight="700">Identidad Digital en Classroom:</text>
      <text x="35" y="158" fill="#64748b" font-size="14">Foto formal de frente, transferida por correo propio.</text>

      <circle cx="12" cy="192" r="10" fill="#d1fae5"/>
      <text x="12" y="196" text-anchor="middle" fill="#059669" font-size="12" font-weight="bold">4</text>
      <text x="35" y="197" fill="#1e293b" font-size="15" font-weight="700">Notebloc Scanner (Regla de Oro):</text>
      <text x="35" y="218" fill="#64748b" font-size="14">Limpiar sombras y guardar en JPEG (¡NUNCA PDF!).</text>
    </g>
  </g>

  <!-- ==================== SEMANA 04 (INFERIOR DERECHA) ==================== -->
  <g filter="url(#shadow)" transform="translate(840, 500)">
    <rect width="500" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="500" height="60" rx="16" fill="url(#sem4Grad)"/>
    <rect y="45" width="500" height="15" fill="url(#sem4Grad)"/>
    <text x="25" y="38" fill="#ffffff" font-size="20" font-weight="800">💻 SEMANA 04: Dominio y Auditoría</text>

    <!-- Puntos Clave -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="12" r="10" fill="#fef3c7"/>
      <text x="12" y="16" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">1</text>
      <text x="35" y="17" fill="#1e293b" font-size="15" font-weight="700">Edición Móvil en Google Docs:</text>
      <text x="35" y="38" fill="#64748b" font-size="14">Autonomía y resolución táctil desde el celular.</text>

      <circle cx="12" cy="72" r="10" fill="#fef3c7"/>
      <text x="12" y="76" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">2</text>
      <text x="35" y="77" fill="#1e293b" font-size="15" font-weight="700">Superpoderes del Teclado (Sin Mouse):</text>
      <text x="35" y="98" fill="#64748b" font-size="14">Alt+Tab (ventanas) • Ctrl+Tab (pestañas) • Shift.</text>

      <circle cx="12" cy="132" r="10" fill="#fef3c7"/>
      <text x="12" y="136" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">3</text>
      <text x="35" y="137" fill="#1e293b" font-size="15" font-weight="700">Auditoría: Orden Inverso de Pestañas:</text>
      <text x="35" y="158" fill="#64748b" font-size="14">Mayor a menor: Semana 04, 03, 02, 01.</text>

      <circle cx="12" cy="192" r="10" fill="#fef3c7"/>
      <text x="12" y="196" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">4</text>
      <text x="35" y="197" fill="#1e293b" font-size="15" font-weight="700">El Formato Rey: Texto 100% Justificado:</text>
      <text x="35" y="218" fill="#64748b" font-size="14">Márgenes rectos parejos en ambos lados.</text>
    </g>
  </g>
</svg>