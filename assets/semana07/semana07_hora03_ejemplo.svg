<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="notebookShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pageMatutino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pageVespertino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="20" width="1160" height="70" rx="14" fill="url(#headerGrad3)" stroke="#334155" stroke-width="1.5" filter="url(#notebookShadow)"/>
  <text x="50" y="52" fill="#f59e0b" font-size="14" font-weight="800" letter-spacing="1.5">CEB 5/4 • TRABAJO MANUAL EN LIBRETA FÍSICA</text>
  <text x="50" y="74" fill="#ffffff" font-size="20" font-weight="800">Resultado Esperado: Hora 3 (Distribución de Página en Libreta según Turno)</text>
  <rect x="990" y="38" width="160" height="34" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1070" y="60" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Revisión y Firma ✍️</text>

  <!-- LIBRETA 1: TURNO MATUTINO (Izquierda) -->
  <g transform="translate(20, 110)">
    <!-- Hoja de Libreta -->
    <rect x="0" y="0" width="560" height="600" rx="14" fill="url(#pageMatutino)" stroke="#cbd5e1" stroke-width="2" filter="url(#notebookShadow)"/>
    
    <!-- Margen rojo de libreta -->
    <line x1="60" y1="0" x2="60" y2="600" stroke="#fca5a5" stroke-width="2"/>
    
    <!-- Espiral de libreta -->
    <g fill="#94a3b8">
      <circle cx="20" cy="40" r="6"/>
      <circle cx="20" cy="100" r="6"/>
      <circle cx="20" cy="160" r="6"/>
      <circle cx="20" cy="220" r="6"/>
      <circle cx="20" cy="280" r="6"/>
      <circle cx="20" cy="340" r="6"/>
      <circle cx="20" cy="400" r="6"/>
      <circle cx="20" cy="460" r="6"/>
      <circle cx="20" cy="520" r="6"/>
      <circle cx="20" cy="570" r="6"/>
    </g>

    <!-- Header Turno Matutino -->
    <rect x="75" y="16" width="460" height="30" rx="6" fill="#fef3c7"/>
    <text x="85" y="36" fill="#b45309" font-size="12" font-weight="800">☀️ MATUTINO: Infografía de Ahorro y Ruta al Museo</text>
    <text x="525" y="36" fill="#64748b" font-size="11" text-anchor="end">16 Octubre 2026</text>

    <!-- Título a mano -->
    <text x="75" y="70" fill="#1e293b" font-size="13" font-weight="800">Infografía PEC: Mi Ahorro hacia el Museo Memoria y Tolerancia</text>

    <!-- Cuadrante 1: Termómetro de Ahorro Dibujado -->
    <g transform="translate(75, 85)">
      <rect x="0" y="0" width="180" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="90" y="20" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">🌡️ Termómetro ($100)</text>
      
      <!-- Tubo termómetro -->
      <rect x="70" y="32" width="40" height="150" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Nivel coloreado acumulado $100 -->
      <rect x="72" y="100" width="36" height="80" rx="4" fill="#22c55e"/>
      <circle cx="90" cy="192" r="22" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
      <text x="90" y="197" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">$100</text>

      <!-- Escala -->
      <text x="60" y="52" fill="#64748b" font-size="9" text-anchor="end">$250 (Meta)</text>
      <line x1="64" y1="48" x2="70" y2="48" stroke="#64748b" stroke-width="1"/>
      <text x="60" y="80" fill="#64748b" font-size="9" text-anchor="end">$200</text>
      <line x1="64" y1="76" x2="70" y2="76" stroke="#64748b" stroke-width="1"/>
      <text x="60" y="108" fill="#16a34a" font-size="9" font-weight="700" text-anchor="end">S07: $100</text>
      <line x1="64" y1="104" x2="72" y2="104" stroke="#16a34a" stroke-width="2"/>
      <text x="60" y="140" fill="#16a34a" font-size="9" font-weight="700" text-anchor="end">S06: $50</text>
      <line x1="64" y1="136" x2="72" y2="136" stroke="#16a34a" stroke-width="2"/>
    </g>

    <!-- Cuadrante 2: 4 Gastos Hormiga Evitados -->
    <g transform="translate(268, 85)">
      <rect x="0" y="0" width="267" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="133" y="20" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">🐜 4 Gastos Hormiga Evitados</text>

      <!-- 4 ítems ilustrados -->
      <g transform="translate(14, 30)">
        <rect x="0" y="0" width="239" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="25" fill="#0f172a" font-size="18">🥤</text>
        <text x="36" y="18" fill="#1e293b" font-size="10" font-weight="700">Refresco de botella</text>
        <text x="36" y="32" fill="#16a34a" font-size="10">Ahorro: +$18.00</text>
      </g>
      <g transform="translate(14, 76)">
        <rect x="0" y="0" width="239" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="25" fill="#0f172a" font-size="18">🥔</text>
        <text x="36" y="18" fill="#1e293b" font-size="10" font-weight="700">Papas fritas / botanas</text>
        <text x="36" y="32" fill="#16a34a" font-size="10">Ahorro: +$22.00</text>
      </g>
      <g transform="translate(14, 122)">
        <rect x="0" y="0" width="239" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="25" fill="#0f172a" font-size="18">🍬</text>
        <text x="36" y="18" fill="#1e293b" font-size="10" font-weight="700">Golosinas y dulces</text>
        <text x="36" y="32" fill="#16a34a" font-size="10">Ahorro: +$10.00</text>
      </g>
      <g transform="translate(14, 168)">
        <rect x="0" y="0" width="239" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="25" fill="#0f172a" font-size="18">🧃</text>
        <text x="36" y="18" fill="#1e293b" font-size="10" font-weight="700">Bebidas azucaradas</text>
        <text x="36" y="32" fill="#16a34a" font-size="10">Ahorro: +$15.00</text>
      </g>
    </g>

    <!-- Cuadrante 3: Reflexión Escrita a Mano (10 renglones) -->
    <g transform="translate(75, 330)">
      <rect x="0" y="0" width="460" height="210" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" fill="#0f172a" font-size="12" font-weight="800">✍️ Reflexión Escrita a Mano (Mínimo 10 Renglones):</text>
      
      <!-- Renglones simulados -->
      <line x1="16" y1="50" x2="444" y2="50" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="46" fill="#475569" font-size="10">1. Es muy importante que nuestro grupo visite el Museo Memoria y Tolerancia porque...</text>
      
      <line x1="16" y1="75" x2="444" y2="75" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="71" fill="#475569" font-size="10">2. conoceremos los hechos históricos donde la falta de respeto y discriminación causaron daño...</text>
      
      <line x1="16" y1="100" x2="444" y2="100" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="96" fill="#475569" font-size="10">3. A través de este proyecto PEC he aprendido a valorar el esfuerzo del ahorro semanal...</text>

      <line x1="16" y1="125" x2="444" y2="125" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="150" x2="444" y2="150" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="175" x2="444" y2="175" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="200" x2="444" y2="200" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="195" fill="#94a3b8" font-size="10">[Completar los 10 renglones con letra clara y legible]</text>
    </g>

    <!-- Sello del Profesor -->
    <g transform="translate(430, 535)">
      <rect x="0" y="0" width="105" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="52" y="24" fill="#16a34a" font-size="10" font-weight="800" text-anchor="middle">REVISADO CEB 5/4</text>
      <text x="52" y="40" fill="#16a34a" font-size="9" text-anchor="middle">Sello / Firma ✍️</text>
    </g>
  </g>

  <!-- LIBRETA 2: TURNO VESPERTINO (Derecha) -->
  <g transform="translate(620, 110)">
    <!-- Hoja de Libreta -->
    <rect x="0" y="0" width="560" height="600" rx="14" fill="url(#pageVespertino)" stroke="#cbd5e1" stroke-width="2" filter="url(#notebookShadow)"/>
    
    <!-- Margen rojo de libreta -->
    <line x1="60" y1="0" x2="60" y2="600" stroke="#fca5a5" stroke-width="2"/>
    
    <!-- Espiral de libreta -->
    <g fill="#94a3b8">
      <circle cx="20" cy="40" r="6"/>
      <circle cx="20" cy="100" r="6"/>
      <circle cx="20" cy="160" r="6"/>
      <circle cx="20" cy="220" r="6"/>
      <circle cx="20" cy="280" r="6"/>
      <circle cx="20" cy="340" r="6"/>
      <circle cx="20" cy="400" r="6"/>
      <circle cx="20" cy="460" r="6"/>
      <circle cx="20" cy="520" r="6"/>
      <circle cx="20" cy="570" r="6"/>
    </g>

    <!-- Header Turno Vespertino -->
    <rect x="75" y="16" width="460" height="30" rx="6" fill="#fae8ff"/>
    <text x="85" y="36" fill="#86198f" font-size="12" font-weight="800">🌙 VESPERTINO: Altar Tradicional de Día de Muertos</text>
    <text x="525" y="36" fill="#64748b" font-size="11" text-anchor="end">16 Octubre 2026</text>

    <!-- Título a mano -->
    <text x="75" y="70" fill="#1e293b" font-size="13" font-weight="800">Proyecto PEC: Simbolismo y Tradición del Altar de Día de Muertos</text>

    <!-- Cuadrante 1: Dibujo del Altar Coloreado -->
    <g transform="translate(75, 85)">
      <rect x="0" y="0" width="200" height="230" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1"/>
      <text x="100" y="20" fill="#86198f" font-size="11" font-weight="700" text-anchor="middle">🕯️ Altar Tradicional a Color</text>
      
      <!-- Niveles del altar dibujados -->
      <rect x="20" y="170" width="160" height="40" rx="4" fill="#fb923c"/>
      <rect x="40" y="125" width="120" height="45" rx="4" fill="#f472b6"/>
      <rect x="65" y="80" width="70" height="45" rx="4" fill="#c084fc"/>
      <rect x="85" y="50" width="30" height="30" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
      <text x="100" y="70" fill="#ca8a04" font-size="14" text-anchor="middle">🖼️</text>
      <text x="100" y="152" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">🍞 Pan de Muerto</text>
      <text x="100" y="195" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">🌼 Cempasúchil</text>
    </g>

    <!-- Cuadrante 2: 7 Elementos Esenciales con Flechas -->
    <g transform="translate(288, 85)">
      <rect x="0" y="0" width="247" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="123" y="20" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">✨ 7 Elementos y su Significado</text>

      <!-- Lista compacta de los 7 elementos -->
      <g transform="translate(10, 30)" font-size="10" fill="#334155">
        <text x="0" y="14"><tspan font-weight="700">1. 💧 Agua:</tspan> Mitiga la sed del alma.</text>
        <text x="0" y="38"><tspan font-weight="700">2. 🧂 Sal:</tspan> Purifica el espíritu.</text>
        <text x="0" y="62"><tspan font-weight="700">3. 🕯️ Velas:</tspan> Luz que guía el regreso.</text>
        <text x="0" y="86"><tspan font-weight="700">4. 💨 Copal:</tspan> Limpia de malos espíritus.</text>
        <text x="0" y="110"><tspan font-weight="700">5. 🌼 Flor Cempasúchil:</tspan> Senda de aroma.</text>
        <text x="0" y="134"><tspan font-weight="700">6. 🍞 Pan de Muerto:</tspan> Fraternidad y vida.</text>
        <text x="0" y="158"><tspan font-weight="700">7. 🖼️ Foto:</tspan> Ser querido a quien se honra.</text>
      </g>
    </g>

    <!-- Cuadrante 3: Reflexión Escrita a Mano (10 renglones) -->
    <g transform="translate(75, 330)">
      <rect x="0" y="0" width="460" height="210" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="24" fill="#0f172a" font-size="12" font-weight="800">✍️ Reflexión Escrita a Mano (Mínimo 10 Renglones):</text>
      
      <!-- Renglones simulados -->
      <line x1="16" y1="50" x2="444" y2="50" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="46" fill="#475569" font-size="10">1. En mi familia y comunidad celebramos el Día de Muertos reuniéndonos para...</text>
      
      <line x1="16" y1="75" x2="444" y2="75" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="71" fill="#475569" font-size="10">2. colocar la ofrenda con la comida favorita de nuestros abuelos y familiares...</text>
      
      <line x1="16" y1="100" x2="444" y2="100" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="96" fill="#475569" font-size="10">3. Es vital que las y los jóvenes cuidemos esta tradición de Hidalgo y México porque...</text>

      <line x1="16" y1="125" x2="444" y2="125" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="150" x2="444" y2="150" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="175" x2="444" y2="175" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="16" y1="200" x2="444" y2="200" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="195" fill="#94a3b8" font-size="10">[Completar los 10 renglones con letra clara y legible]</text>
    </g>

    <!-- Sello del Profesor -->
    <g transform="translate(430, 535)">
      <rect x="0" y="0" width="105" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="52" y="24" fill="#16a34a" font-size="10" font-weight="800" text-anchor="middle">REVISADO CEB 5/4</text>
      <text x="52" y="40" fill="#16a34a" font-size="9" text-anchor="middle">Sello / Firma ✍️</text>
    </g>
  </g>
</svg>
