<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="20" width="1160" height="70" rx="14" fill="url(#headerGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="50" y="52" fill="#c084fc" font-size="14" font-weight="800" letter-spacing="1.5">CEB 5/4 • PROYECTO PEC Y CULTURA DIGITAL I</text>
  <text x="50" y="74" fill="#ffffff" font-size="20" font-weight="800">Resultado Esperado: Hora 2 (Subcarpetas PEC + Tabla en Docs + Enlace)</text>
  <rect x="1000" y="38" width="150" height="34" rx="8" fill="#9333ea" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1075" y="60" fill="#d8b4fe" font-size="13" font-weight="700" text-anchor="middle">Semana 07 📁</text>

  <!-- PANEL IZQUIERDO: SUBCARPETAS GOOGLE DRIVE POR TURNO -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="560" height="580" rx="16" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    
    <!-- Header Drive Subcarpetas -->
    <rect x="0" y="0" width="560" height="60" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="30" r="14" fill="#a855f7" fill-opacity="0.2"/>
    <text x="36" y="36" fill="#c084fc" font-size="16" text-anchor="middle">📂</text>
    <text x="65" y="32" fill="#ffffff" font-size="16" font-weight="700">1. Subcarpetas en Google Drive (Dentro de 06 PEC)</text>
    <text x="65" y="48" fill="#94a3b8" font-size="12">Crea las 3 subcarpetas correspondientes a tu turno escolar</text>

    <!-- Bloque Matutino -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="512" height="170" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
      <rect x="14" y="12" width="484" height="28" rx="6" fill="#eab308" fill-opacity="0.15"/>
      <text x="24" y="31" fill="#facc15" font-size="13" font-weight="800">☀️ TURNO MATUTINO (Visita Educativa al Museo Memoria y Tolerancia)</text>

      <!-- 3 subcarpetas matutino -->
      <g transform="translate(14, 50)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 1. Ahorro y Presupuesto</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Hojas de cálculo y comprobantes</text>
      </g>
      <g transform="translate(14, 88)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 2. Permisos y Documentos</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Credencial y permisos firmados</text>
      </g>
      <g transform="translate(14, 126)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 3. Itinerario del Museo</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Guía de salas y recorrido CDMX</text>
      </g>
    </g>

    <!-- Bloque Vespertino -->
    <g transform="translate(24, 260)">
      <rect x="0" y="0" width="512" height="170" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="14" y="12" width="484" height="28" rx="6" fill="#a855f7" fill-opacity="0.15"/>
      <text x="24" y="31" fill="#c084fc" font-size="13" font-weight="800">🌙 TURNO VESPERTINO (Proyecto Cultural: Altar de Día de Muertos)</text>

      <!-- 3 subcarpetas vespertino -->
      <g transform="translate(14, 50)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 1. Elementos del Altar</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Bocetos e investigación cultural</text>
      </g>
      <g transform="translate(14, 88)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 2. Calaveritas y Relatos</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Textos literarios y leyendas</text>
      </g>
      <g transform="translate(14, 126)">
        <rect x="0" y="0" width="484" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f8fafc" font-size="12" font-weight="700">📁 3. Fotos de la Ofrenda</text>
        <text x="472" y="21" fill="#94a3b8" font-size="11" text-anchor="end">Evidencias del montaje y altar</text>
      </g>
    </g>

    <!-- Instrucción de Compartir Enlace -->
    <g transform="translate(24, 444)">
      <rect x="0" y="0" width="512" height="114" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="800">🔗 Paso Clave: Copiar Enlace Seguro en Modo Lector</text>
      <text x="20" y="52" fill="#cbd5e1" font-size="12">1. Clic derecho en tu carpeta <tspan fill="#c084fc" font-weight="700">06 PEC</tspan> ➔ <tspan fill="#facc15" font-weight="700">Compartir</tspan></text>
      <text x="20" y="74" fill="#cbd5e1" font-size="12">2. Acceso general: <tspan fill="#4ade80" font-weight="700">Cualquiera en DGB con el enlace</tspan> en rol <tspan fill="#38bdf8" font-weight="700">Lector</tspan></text>
      <text x="20" y="96" fill="#cbd5e1" font-size="12">3. Da clic en <tspan fill="#60a5fa" font-weight="700">Copiar enlace</tspan> para pegarlo en tu Google Docs</text>
    </g>
  </g>

  <!-- PANEL DERECHO: GOOGLE DOCS (Dictado 2 + Tabla PEC + Enlace) -->
  <g transform="translate(600, 110)">
    <rect x="0" y="0" width="580" height="580" rx="16" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    
    <!-- Header Docs -->
    <rect x="0" y="0" width="580" height="60" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="30" r="14" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="36" y="36" fill="#60a5fa" font-size="16" text-anchor="middle">📝</text>
    <text x="65" y="32" fill="#ffffff" font-size="16" font-weight="700">2. En Google Docs: Continuar en «Semana 07 📁»</text>
    <text x="65" y="48" fill="#94a3b8" font-size="12">Debajo de la tabla de materias de la Hora 1</text>

    <!-- Dictado 2 -->
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="532" height="24" rx="6" fill="#2563eb" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
      <text x="266" y="16" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">TÍTULO: TAMAÑO 20 • NEGRITA • CENTRADO</text>

      <text x="266" y="46" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">Organización de Archivos y Evidencias del PEC</text>

      <rect x="0" y="58" width="532" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="266" y="73" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">TEXTO DEL DICTADO: TAMAÑO 14 • JUSTIFICADO</text>

      <rect x="0" y="88" width="532" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="108" fill="#cbd5e1" font-size="12">"Un proyecto escolar exitoso necesita un expediente digital ordenado donde guardar evidencias,</text>
      <text x="14" y="126" fill="#cbd5e1" font-size="12">fotos y documentos. Nombrar cada archivo indicando el contenido, fecha y nombre de estudiante...</text>
      <text x="14" y="144" fill="#60a5fa" font-size="11" font-weight="600">Idea Clave: Nombrar tus archivos con orden y claridad demuestra profesionalismo."</text>
    </g>

    <!-- Tabla PEC 3x4 -->
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="532" height="24" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
      <text x="266" y="16" fill="#d8b4fe" font-size="11" font-weight="700" text-anchor="middle">TABLA DEL PEC: 3 COLUMNAS × 4 FILAS • TAMAÑO 10</text>

      <rect x="0" y="32" width="532" height="165" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      
      <!-- Fila Header -->
      <rect x="0" y="32" width="532" height="32" rx="8" fill="#1e293b"/>
      <line x1="160" y1="32" x2="160" y2="197" stroke="#475569" stroke-width="1"/>
      <line x1="330" y1="32" x2="330" y2="197" stroke="#475569" stroke-width="1"/>
      
      <text x="16" y="53" fill="#f8fafc" font-size="11" font-weight="800">Subcarpeta del PEC</text>
      <text x="175" y="53" fill="#f8fafc" font-size="11" font-weight="800">¿Qué archivo guardará?</text>
      <text x="345" y="53" fill="#f8fafc" font-size="11" font-weight="800">Ejemplo Nombre Archivo</text>
      <line x1="0" y1="64" x2="532" y2="64" stroke="#475569" stroke-width="1.5"/>

      <!-- Fila 1 -->
      <text x="16" y="90" fill="#cbd5e1" font-size="10" font-weight="700">1. Ahorro / Elementos</text>
      <text x="175" y="90" fill="#94a3b8" font-size="10">Presupuestos / Bocetos</text>
      <text x="345" y="90" fill="#38bdf8" font-size="10">Presupuesto_S07_Felipe.xlsx</text>
      <line x1="0" y1="108" x2="532" y2="108" stroke="#334155" stroke-width="1"/>

      <!-- Fila 2 -->
      <text x="16" y="132" fill="#cbd5e1" font-size="10" font-weight="700">2. Permisos / Calaveras</text>
      <text x="175" y="132" fill="#94a3b8" font-size="10">Permisos / Textos PEC</text>
      <text x="345" y="132" fill="#38bdf8" font-size="10">Permiso_Museo_Felipe.pdf</text>
      <line x1="0" y1="152" x2="532" y2="152" stroke="#334155" stroke-width="1"/>

      <!-- Fila 3 -->
      <text x="16" y="176" fill="#cbd5e1" font-size="10" font-weight="700">3. Itinerario / Fotos</text>
      <text x="175" y="176" fill="#94a3b8" font-size="10">Guías / Fotos de Ofrenda</text>
      <text x="345" y="176" fill="#38bdf8" font-size="10">Itinerario_Visita_CDMX.pdf</text>
    </g>

    <!-- Enlace Compartido en Docs -->
    <g transform="translate(24, 465)">
      <rect x="0" y="0" width="532" height="92" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text x="16" y="26" fill="#4ade80" font-size="12" font-weight="800">✅ Enlace a la Carpeta Compartida Pegado en Docs:</text>
      <rect x="16" y="38" width="500" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="28" y="62" fill="#f8fafc" font-size="11" font-weight="600">Enlace a mi Carpeta PEC: <tspan fill="#38bdf8" text-decoration="underline">https://drive.google.com/drive/folders/1aBcD...eFg</tspan></text>
    </g>
  </g>
</svg>
