      <text x="185" y="254" fill="#f472b6" font-size="10">06 Formación Socioemocional</text>
      <rect x="420" y="242" width="80" height="18" rx="4" fill="#ec4899" fill-opacity="0.3"/>
      <text x="460" y="255" fill="#f472b6" font-size="10" font-weight="700" text-anchor="middle">Rosa</text>
