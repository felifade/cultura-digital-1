    <text x="44" y="420" fill="#38bdf8" font-size="13" font-weight="700">💡 ¿Cómo asignar color a tus carpetas en Drive?</text>
    <text x="44" y="450" fill="#cbd5e1" font-size="12">1. Haz clic derecho sobre la carpeta que creaste.</text>
    <text x="44" y="475" fill="#cbd5e1" font-size="12">2. Selecciona <tspan fill="#60a5fa" font-weight="700">Organizar</tspan> ➔ <tspan fill="#facc15" font-weight="700">Color</tspan>.</text>
    <text x="44" y="500" fill="#cbd5e1" font-size="12">3. Elige el color indicado para cada una de las 7 carpetas.</text>
    <text x="44" y="535" fill="#ec4899" font-size="12" font-weight="700">🌸 Formación Socioemocional I: Asignar color Rosa.</text>
    <text x="44" y="565" fill="#94a3b8" font-size="12">✨ ¡Organizar por color te permite identificar tus materias al instante!</text>
