      <line x1="170" y1="28" x2="170" y2="368" stroke="#475569" stroke-width="1"/>
      <line x1="390" y1="28" x2="390" y2="368" stroke="#475569" stroke-width="1"/>
      
      <text x="20" y="49" fill="#f8fafc" font-size="11" font-weight="800">Materia / Proyecto</text>
