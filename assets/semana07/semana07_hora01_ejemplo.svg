      <text x="266" y="42" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">La Mochila Digital y el Orden en la Nube</text>

      <rect x="0" y="52" width="532" height="20" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="266" y="66" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">TEXTO DEL DICTADO: TAMAÑO 14 • JUSTIFICADO</text>

      <rect x="0" y="78" width="532" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="96" fill="#cbd5e1" font-size="11">"Así como en la mochila física usamos libretas separadas para no revolver los apuntes,</text>
      <text x="14" y="112" fill="#cbd5e1" font-size="11">en Google Drive debemos organizar carpetas por materia. Tener un espacio ordenado...</text>
      <text x="14" y="128" fill="#60a5fa" font-size="11" font-weight="600">Idea Clave: El orden en las carpetas digitales te ahorra tiempo y evita perder tareas."</text>
    </g>

