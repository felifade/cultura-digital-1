<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="driveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="docsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Banner Superior -->
  <rect x="20" y="20" width="1160" height="70" rx="14" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="52" fill="#38bdf8" font-size="14" font-weight="800" letter-spacing="1.5">CEB 5/4 • CULTURA DIGITAL I</text>
  <text x="50" y="74" fill="#ffffff" font-size="20" font-weight="800">Resultado Esperado: Hora 1 (Google Drive + Google Docs)</text>
  <rect x="1000" y="38" width="150" height="34" rx="8" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1075" y="60" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Semana 07 📁</text>

  <!-- PANEL IZQUIERDO: GOOGLE DRIVE (Mochila Digital - 7 Carpetas) -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="560" height="625" rx="16" fill="url(#driveGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Drive -->
    <rect x="0" y="0" width="560" height="56" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="36" cy="28" r="13" fill="#22c55e" fill-opacity="0.2"/>
    <text x="36" y="34" fill="#4ade80" font-size="15" text-anchor="middle">☁️</text>
    <text x="65" y="30" fill="#ffffff" font-size="15" font-weight="700">1. En Google Drive: Tu Mochila Digital</text>
    <text x="65" y="46" fill="#94a3b8" font-size="11">Ruta: Mi unidad > 📁 1er Semestre - CEB 5/4</text>

    <!-- Carpeta Principal Tag -->
    <rect x="24" y="70" width="512" height="38" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="44" y="94" fill="#60a5fa" font-size="13" font-weight="700">📁 Carpeta Contenedora: 1er Semestre - CEB 5/4</text>

    <!-- Subcarpetas 7 con colores -->
    <!-- 01 Cultura Digital I (Azul) -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="246" height="54" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="12" y="11" width="32" height="32" rx="8" fill="#2563eb" fill-opacity="0.25"/>
      <text x="28" y="32" fill="#60a5fa" font-size="17" text-anchor="middle">📁</text>
      <text x="56" y="26" fill="#f8fafc" font-size="12" font-weight="700">01 Cultura Digital I</text>
      <text x="56" y="42" fill="#60a5fa" font-size="11" font-weight="600">Color: Azul</text>
    </g>

    <!-- 02 Lengua y Comunicación I (Amarillo) -->
    <g transform="translate(290, 120)">
      <rect x="0" y="0" width="246" height="54" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
      <rect x="12" y="11" width="32" height="32" rx="8" fill="#eab308" fill-opacity="0.25"/>
      <text x="28" y="32" fill="#facc15" font-size="17" text-anchor="middle">📁</text>
      <text x="56" y="26" fill="#f8fafc" font-size="12" font-weight="700">02 Lengua y Comunicación</text>
      <text x="56" y="42" fill="#facc15" font-size="11" font-weight="600">Color: Amarillo</text>
    </g>

