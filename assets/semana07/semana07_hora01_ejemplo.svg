      <rect x="0" y="0" width="246" height="54" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="12" y="11" width="32" height="32" rx="8" fill="#ef4444" fill-opacity="0.25"/>
      <text x="28" y="32" fill="#f87171" font-size="17" text-anchor="middle">📁</text>
      <text x="56" y="26" fill="#f8fafc" font-size="12" font-weight="700">03 Pensamiento Matemático</text>
      <text x="56" y="42" fill="#f87171" font-size="11" font-weight="600">Color: Rojo</text>
    </g>

    <!-- 04 Ciencias Sociales I (Verde) -->
    <g transform="translate(290, 186)">
      <rect x="0" y="0" width="246" height="54" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="12" y="11" width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.25"/>
      <text x="28" y="32" fill="#34d399" font-size="17" text-anchor="middle">📁</text>
      <text x="56" y="26" fill="#f8fafc" font-size="12" font-weight="700">04 Ciencias Sociales I</text>
      <text x="56" y="42" fill="#34d399" font-size="11" font-weight="600">Color: Verde</text>
