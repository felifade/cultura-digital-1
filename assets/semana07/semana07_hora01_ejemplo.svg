      <rect x="12" y="11" width="32" height="32" rx="8" fill="#f97316" fill-opacity="0.25"/>
      <text x="28" y="32" fill="#fb923c" font-size="17" text-anchor="middle">📁</text>
      <text x="56" y="26" fill="#f8fafc" font-size="12" font-weight="700">05 Humanidades I</text>
      <text x="56" y="42" fill="#fb923c" font-size="11" font-weight="600">Color: Naranja</text>
