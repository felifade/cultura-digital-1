      <rect x="420" y="174" width="80" height="18" rx="4" fill="#10b981" fill-opacity="0.3"/>
      <text x="460" y="187" fill="#86efac" font-size="10" font-weight="700" text-anchor="middle">Verde</text>
      <line x1="0" y1="198" x2="532" y2="198" stroke="#334155" stroke-width="1"/>

      <!-- Fila 5 -->
      <text x="20" y="220" fill="#cbd5e1" font-size="10" font-weight="600">Humanidades I</text>
      <text x="185" y="220" fill="#fdba74" font-size="10">05 Humanidades I</text>
      <rect x="420" y="208" width="80" height="18" rx="4" fill="#f97316" fill-opacity="0.3"/>
      <text x="460" y="221" fill="#fdba74" font-size="10" font-weight="700" text-anchor="middle">Naranja</text>
      <line x1="0" y1="232" x2="532" y2="232" stroke="#334155" stroke-width="1"/>

