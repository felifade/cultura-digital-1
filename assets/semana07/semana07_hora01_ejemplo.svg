      <text x="460" y="49" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle">Color Asignado</text>
      <line x1="0" y1="60" x2="532" y2="60" stroke="#475569" stroke-width="1.5"/>

      <!-- Fila 1 -->
      <text x="20" y="84" fill="#cbd5e1" font-size="10" font-weight="600">Cultura Digital I</text>
      <text x="185" y="84" fill="#93c5fd" font-size="10">01 Cultura Digital I</text>
      <rect x="420" y="72" width="80" height="18" rx="4" fill="#2563eb" fill-opacity="0.3"/>
      <text x="460" y="85" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">Azul</text>
      <line x1="0" y1="96" x2="532" y2="96" stroke="#334155" stroke-width="1"/>

      <!-- Fila 2 -->
      <text x="20" y="118" fill="#cbd5e1" font-size="10" font-weight="600">Lengua y Comunicación I</text>
      <text x="185" y="118" fill="#fef08a" font-size="10">02 Lengua y Comunicación</text>
      <rect x="420" y="106" width="80" height="18" rx="4" fill="#eab308" fill-opacity="0.3"/>
      <text x="460" y="119" fill="#fef08a" font-size="10" font-weight="700" text-anchor="middle">Amarillo</text>
      <line x1="0" y1="130" x2="532" y2="130" stroke="#334155" stroke-width="1"/>

      <!-- Fila 3 -->
      <text x="20" y="152" fill="#cbd5e1" font-size="10" font-weight="600">Pensamiento Matemático I</text>
      <text x="185" y="152" fill="#fca5a5" font-size="10">03 Pensamiento Matemático</text>
      <rect x="420" y="140" width="80" height="18" rx="4" fill="#ef4444" fill-opacity="0.3"/>
      <text x="460" y="153" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">Rojo</text>
      <line x1="0" y1="164" x2="532" y2="164" stroke="#334155" stroke-width="1"/>

      <!-- Fila 4 -->
