<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="background:#ffffff; font-family:'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipLeft">
      <rect x="24" y="64" width="380" height="230" rx="8"/>
    </clipPath>
    <clipPath id="clipRight">
      <rect x="24" y="64" width="380" height="230" rx="8"/>
    </clipPath>
  </defs>

  <!-- Fondo general -->
  <rect x="4" y="4" width="872" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="32" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">📱 Guía Práctica: Sin Técnica vs. Aplicando Regla de los Tercios (Sin Zoom)</text>

  <!-- TARJETA IZQUIERDA: MAL EJEMPLO -->
  <g transform="translate(14, 46)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="416" height="328" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="0" y="0" width="416" height="44" rx="10" fill="#fef2f2"/>
    <rect x="0" y="34" width="416" height="10" fill="#fef2f2"/>
    <text x="208" y="28" fill="#991b1b" font-size="13.5" font-weight="800" text-anchor="middle">❌ EVITA ESTO: Zoom Digital y Sin Tercios</text>

    <!-- Marco Simulado Foto Mala -->
    <g clip-path="url(#clipLeft)">
      <rect x="24" y="64" width="380" height="230" fill="#e2e8f0"/>
      <!-- Mochila/distractor grande atrás -->
      <rect x="28" y="88" width="90" height="160" rx="10" fill="#94a3b8" opacity="0.65"/>
      <text x="73" y="172" fill="#475569" font-size="10" font-weight="700" text-anchor="middle">Mochila atrás</text>
      <!-- Objeto/Artesanía aplastado en el centro y con "pixelado" -->
      <rect x="148" y="112" width="132" height="132" fill="#d97706" opacity="0.35"/>
      <rect x="160" y="124" width="108" height="108" fill="#b45309" opacity="0.45"/>
      <rect x="172" y="136" width="84" height="84" fill="#c25934" opacity="0.75"/>
      <circle cx="214" cy="178" r="24" fill="#fde68a" opacity="0.6"/>
      <!-- Grid de pixeles para simular zoom digital borroso -->
      <path d="M148,140 H280 M148,168 H280 M148,196 H280 M148,224 H280 M176,112 V244 M204,112 V244 M232,112 V244 M260,112 V244" stroke="#ffffff" stroke-width="1.2" opacity="0.45"/>
      <!-- Badge Zoom Digital -->
      <rect x="308" y="74" width="84" height="24" rx="12" fill="#dc2626"/>
      <text x="350" y="90" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">Zoom 3.0x ❌</text>
      <!-- Alerta centro muerto -->
      <rect x="136" y="254" width="156" height="22" rx="4" fill="#991b1b" opacity="0.9"/>
      <text x="214" y="269" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">Borroso y pegado al centro</text>
    </g>
    <rect x="24" y="64" width="380" height="230" rx="8" fill="none" stroke="#f87171" stroke-width="1.5"/>

    <text x="208" y="314" fill="#7f1d1d" font-size="10.5" font-weight="600" text-anchor="middle">Zoom digital pixela la imagen y centrar todo sin aire resta fuerza visual.</text>
  </g>

  <!-- TARJETA DERECHA: BUEN EJEMPLO -->
  <g transform="translate(450, 46)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="416" height="328" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="0" y="0" width="416" height="44" rx="10" fill="#f0fdf4"/>
    <rect x="0" y="34" width="416" height="10" fill="#f0fdf4"/>
    <text x="208" y="28" fill="#166534" font-size="13.5" font-weight="800" text-anchor="middle">✅ HAZ ESTO: Sin Zoom + Regla de Tercios (3×3)</text>

    <!-- Marco Simulado Foto Buena con Ventana + Cuadricula 3x3 -->
    <g clip-path="url(#clipRight)">
      <rect x="24" y="64" width="380" height="230" fill="#fffbeb"/>
      <!-- Haz suave de luz natural desde ventana izquierda -->
      <polygon points="24,64 170,64 250,294 24,294" fill="#fef3c7" opacity="0.65"/>
      <!-- Fondo limpio de mesa -->
      <rect x="24" y="218" width="380" height="76" fill="#fde68a" opacity="0.45"/>

      <!-- Objeto / Artesania ubicado en el cruce DERECHO (x=277) o IZQUIERDO (x=151) -->
      <!-- Aqui ubicamos la artesania/sujeto exactamente en la linea vertical derecha x=277, y=141..217 -->
      <circle cx="277" cy="178" r="46" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
      <path d="M245,178 Q277,146 309,178 Q277,210 245,178 Z" fill="#c25934"/>
      <circle cx="277" cy="178" r="10" fill="#0f2c59"/>

      <!-- Espacio limpio izquierdo (entre x=24 y x=150 sin tocar puntos de fuerza) -->
      <rect x="34" y="148" width="106" height="60" rx="6" fill="#ffffff" opacity="0.92" stroke="#cbd5e1" stroke-dasharray="4,3"/>
      <text x="87" y="172" fill="#0f2c59" font-size="10" font-weight="800" text-anchor="middle">Aire Visual</text>
      <text x="87" y="188" fill="#475569" font-size="8.5" text-anchor="middle">Espacio para texto</text>
      <text x="87" y="200" fill="#475569" font-size="8.5" text-anchor="middle">o mirada libre</text>

      <!-- CUADRICULA 3x3 (Regla de los Tercios: tercios en x=151, 277 y y=141, 217) -->
      <line x1="150.6" y1="64" x2="150.6" y2="294" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,3" opacity="0.55"/>
      <line x1="277.3" y1="64" x2="277.3" y2="294" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,3" opacity="0.55"/>
      <line x1="24" y1="140.6" x2="404" y2="140.6" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,3" opacity="0.55"/>
      <line x1="24" y1="217.3" x2="404" y2="217.3" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,3" opacity="0.55"/>

      <!-- 4 Puntos de Fuerza (Intersecciones) -->
      <circle cx="150.6" cy="140.6" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="150.6" cy="217.3" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="277.3" cy="140.6" r="6.5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="277.3" cy="217.3" r="6.5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

      <!-- Badges informativos -->
      <rect x="34" y="74" width="112" height="22" rx="11" fill="#16a34a"/>
      <text x="90" y="89" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">1.0x Sin Zoom ✅</text>

      <rect x="256" y="74" width="138" height="22" rx="11" fill="#0f2c59"/>
      <text x="325" y="89" fill="#fde68a" font-size="9.5" font-weight="800" text-anchor="middle">📍 Punto de Fuerza</text>
    </g>
    <rect x="24" y="64" width="380" height="230" rx="8" fill="none" stroke="#22c55e" stroke-width="1.8"/>

    <text x="208" y="314" fill="#14532d" font-size="10.5" font-weight="600" text-anchor="middle">Acércate con tus pies, activa Cuadrícula 3×3 y ubica el foco en un cruce.</text>
  </g>
</svg>