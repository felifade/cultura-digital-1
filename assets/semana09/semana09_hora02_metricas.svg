    <text x="398" y="69" fill="#202124" font-size="11" text-anchor="end">32</text>
    <text x="528" y="69" fill="#202124" font-size="11" text-anchor="end">94%</text>
    <text x="658" y="69" fill="#202124" font-size="11" text-anchor="end">3</text>
    <line x1="0" y1="78" x2="840" y2="78" stroke="#dadce0" stroke-width="1"/>

