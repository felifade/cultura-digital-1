    <text x="20" y="121" fill="#444746" font-size="11" font-weight="600" text-anchor="middle">4</text>
    <text x="50" y="121" fill="#202124" font-size="11">Ronda 3 (Test 3 min)</text>
    <text x="398" y="121" fill="#202124" font-size="11" text-anchor="end">41</text>
    <text x="528" y="121" fill="#202124" font-size="11" text-anchor="end">95%</text>
